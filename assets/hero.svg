<!-- Hero estatico: nenhum elemento de conteudo depende de animacao para aparecer.
     O unico elemento animado e o cursor - tambem o unico ponto com glow (design system, secao 8). -->
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Fernando Figueiredo — analise de dados com SQL, Power BI, Python e machine learning">
  <title>Fernando Figueiredo — analise de dados com SQL, Power BI, Python e machine learning</title>
  <style>
    .m    { font-family: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sec  { fill: #AAB8CC; }
    .pri  { fill: #F2F7FF; }
    .cia  { fill: #00E5FF; }
    .dad  { fill: #A970FF; }
  </style>
  <defs>
    <filter id="brilho" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#101522" stroke="#202938"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h855a12 12 0 0 1 12 12V40H0.5Z" fill="#151C2B"/>
  <line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#202938"/>
  <circle cx="24" cy="20" r="4" fill="#202938"/>
  <circle cx="40" cy="20" r="4" fill="#202938"/>
  <circle cx="56" cy="20" r="4" fill="#202938"/>
  <text class="m sec" x="80" y="24.5" font-size="12.8">fernando@dados — python 3.14</text>

  <text class="m" x="32" y="80" font-size="14"><tspan class="cia">$</tspan><tspan class="pri" dx="9">bio --perfil</tspan></text>
  <text class="m" x="32" y="112" font-size="14"><tspan class="sec">base</tspan><tspan class="sec" dx="8">········</tspan><tspan class="pri" dx="8">10+ anos em Comunicação, Estratégia e Storytelling</tspan></text>
  <text class="m" x="32" y="136" font-size="14"><tspan class="sec">stack</tspan><tspan class="sec" dx="8">·······</tspan><tspan class="dad" dx="8">SQL · Power BI · Python · Machine Learning</tspan></text>
  <text class="m" x="32" y="160" font-size="14"><tspan class="sec">foco</tspan><tspan class="sec" dx="8">········</tspan><tspan class="pri" dx="8">transformar dados em respostas</tspan></text>

  <line x1="32" y1="192" x2="848" y2="192" stroke="#202938"/>

  <text class="m pri" x="32" y="242" font-size="39" letter-spacing="1" font-weight="700">FERNANDO FIGUEIREDO</text>
  <text class="m sec" x="33" y="270" font-size="14">análise de dados · business intelligence · machine learning</text>
  <rect x="33" y="282" width="9" height="3" fill="#00E5FF" filter="url(#brilho)"/>
  <rect x="33" y="282" width="9" height="3" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
