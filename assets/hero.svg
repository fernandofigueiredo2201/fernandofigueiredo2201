<!-- Hero estatico: o conteudo nao depende de animacao para aparecer.
     O unico elemento animado e o cursor - tambem o unico ponto com glow (design system, secao 8). -->
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-label="Fernando Figueiredo — análise de dados e business intelligence">
  <title>Fernando Figueiredo — análise de dados e business intelligence</title>
  <style>
    .m { font-family: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <filter id="brilho" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="169" rx="12" fill="#101522" stroke="#202938"/>

  <text class="m" x="32" y="90" font-size="39" letter-spacing="1" font-weight="700" fill="#F2F7FF">FERNANDO FIGUEIREDO</text>
  <text class="m" x="33" y="120" font-size="14" fill="#AAB8CC">análise de dados · business intelligence</text>
  <rect x="33" y="132" width="9" height="3" fill="#00E5FF" filter="url(#brilho)"/>
  <rect x="33" y="132" width="9" height="3" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
